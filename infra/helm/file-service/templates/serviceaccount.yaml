apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "file-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "file-service.labels" . | nindent 4 }}
  annotations:
    iam.gke.io/gcp-service-account: {{ .Values.platform.fileServiceGsa | quote }}
automountServiceAccountToken: false # app never talks to the K8s API
