{{- if include "file-service.isApp" . }}
# Managed Prometheus scrape config (only the real app exposes /metrics).
apiVersion: monitoring.googleapis.com/v1
kind: PodMonitoring
metadata:
  name: {{ include "file-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "file-service.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "file-service.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: 30s
{{- end }}
