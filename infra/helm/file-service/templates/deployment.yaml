{{- $isApp := include "file-service.isApp" . -}}
{{- $uid := include "file-service.runAsUser" . | int -}}
{{- $sqlPort := .Values.cloudSqlProxy.port | int -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "file-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "file-service.labels" . | nindent 4 }}
spec:
  # replicas is owned by the HPA: deliberately not set, so upgrades never reset it.
  selector:
    matchLabels:
      {{- include "file-service.selectorLabels" . | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0 # never reduce capacity during a deploy
  template:
    metadata:
      labels:
        {{- include "file-service.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/part-of: file-platform
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: {{ include "file-service.name" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $uid }}
        runAsGroup: {{ $uid }}
        fsGroup: {{ $uid }}
        seccompProfile:
          type: RuntimeDefault
      # Spread evenly across the region's 3 zones: losing a zone loses <= 1/3 of capacity.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              {{- include "file-service.selectorLabels" . | nindent 14 }}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "file-service.selectorLabels" . | nindent 14 }}
      containers:
        - name: app
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if $isApp }}
          env:
            - name: FS_ENV
              value: {{ .Values.environment | quote }}
            - name: FS_STORAGE_BACKEND
              value: gcs
            - name: FS_STORAGE_BUCKET
              value: {{ .Values.platform.bucketName | quote }}
            - name: FS_METADATA_BACKEND
              value: postgres
            - name: FS_DATABASE_URL
              value: {{ printf "postgresql://%s@127.0.0.1:%d/files" (.Values.platform.dbIamUser | urlquery) $sqlPort | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otelEndpoint | quote }}
          {{- end }}
          resources:
            requests:
              cpu: {{ .Values.resources.cpuRequest | quote }}
              memory: {{ .Values.resources.memoryRequest | quote }}
            limits:
              memory: {{ .Values.resources.memoryRequest | quote }} # no CPU limit: avoid CFS throttling latency spikes
          readinessProbe:
            httpGet:
              path: {{ ternary "/readyz" "/" (eq $isApp "true") }}
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: {{ ternary "/healthz" "/" (eq $isApp "true") }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          {{- if not $isApp }}
          lifecycle:
            preStop:
              # Keep serving while the LB removes this endpoint (avoids 502s on rollout).
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        {{- if $isApp }}
        # Cloud SQL Auth Proxy: mTLS to Cloud SQL + automatic IAM DB authentication.
        - name: cloud-sql-proxy
          image: {{ .Values.cloudSqlProxy.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args:
            - --private-ip
            - --auto-iam-authn
            - --structured-logs
            - --port={{ $sqlPort }}
            - --health-check
            - --http-address=0.0.0.0
            - --exit-zero-on-sigterm
            - --max-sigterm-delay=30s
            - {{ .Values.platform.sqlConnectionName | quote }}
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
        {{- end }}
      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
