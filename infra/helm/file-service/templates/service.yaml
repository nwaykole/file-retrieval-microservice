apiVersion: v1
kind: Service
metadata:
  name: {{ include "file-service.name" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "file-service.labels" . | nindent 4 }}
spec:
  type: ClusterIP # container-native LB via NEGs: GFE -> pod IP directly, no kube-proxy hop
  selector:
    {{- include "file-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
