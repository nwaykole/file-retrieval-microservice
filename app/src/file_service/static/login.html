<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your files</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js" defer></script>
</head>
<body>
<main>
  <h1>Your files</h1>

  <section id="login-view" hidden>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required minlength="3" maxlength="128">
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required minlength="12" maxlength="1024">
      <button type="submit">Log in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </section>

  <section id="files-view" hidden>
    <div class="bar">
      <span>Signed in</span>
      <button id="logout" type="button" class="secondary">Log out</button>
    </div>
    <p id="empty" class="muted" hidden>You have no files yet.</p>
    <table id="files" hidden>
      <thead><tr><th>Name</th><th>Type</th><th class="num">Size</th><th></th></tr></thead>
      <tbody></tbody>
    </table>
    <p id="files-error" class="error" role="alert"></p>
  </section>
</main>
</body>
</html>
