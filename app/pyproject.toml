[project]
name = "file-service"
version = "1.0.0"
description = "Customer file retrieval microservice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "cachetools>=5.5",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
gcp = [
  "google-cloud-storage>=2.18",
  "asyncpg>=0.29",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp-proto-grpc>=1.27",
  "opentelemetry-instrumentation-fastapi>=0.48b0",
]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
file_service = ["static/*"]   # login page assets

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs real backends (docker compose -f docker-compose.it.yml)"]
# Plain `pytest` runs unit tests only; `pytest -m integration` runs the integration suite
# (a later -m on the command line replaces this one).
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S", "UP"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
