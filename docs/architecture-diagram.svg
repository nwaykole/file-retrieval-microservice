<svg viewBox="0 0 1000 740" width="2000" height="1480" xmlns="http://www.w3.org/2000/svg"><style>svg text{font-family:Arial,Helvetica,sans-serif;fill:#1b2530}
.t-h{font-family:'Arial Narrow',Arial,sans-serif;font-weight:600;font-size:15px}
.t-s{font-size:11.5px;fill:#5b6876}
.t-m{font-family:Consolas,'Courier New',monospace;font-size:10.5px;fill:#5b6876}
.t-zone{font-family:Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase}
.n{font-family:Consolas,'Courier New',monospace;font-size:11px;font-weight:500;fill:#ffffff}
.b-plain{fill:#ffffff;stroke:#c9d2db;stroke-width:1.2}
.b-edge{fill:#e3eef9;stroke:#2f6fb3;stroke-width:1.4}
.b-gke{fill:#e2f2ea;stroke:#3b8a6e;stroke-width:1.4}
.b-pod{fill:#ffffff;stroke:#3b8a6e;stroke-width:1.2}
.b-data{fill:#f8ecdf;stroke:#a2652b;stroke-width:1.4}
.b-async{fill:#efe8f8;stroke:#7a58b0;stroke-width:1.4}
.b-region{fill:none;stroke:#5b6876;stroke-width:1.2;stroke-dasharray:6 5}
.b-zone{fill:none;stroke:#3b8a6e;stroke-width:1;stroke-dasharray:3 4}
.a{fill:none;stroke:#1b2530;stroke-width:1.5}
.a-flow{fill:none;stroke:#c23d5b;stroke-width:2}
.a-dash{fill:none;stroke:#5b6876;stroke-width:1.4;stroke-dasharray:5 4}
.a-async{fill:none;stroke:#7a58b0;stroke-width:1.6}
.dot{fill:#c23d5b}
.ah{fill:#1b2530} .ah-flow{fill:#c23d5b} .ah-muted{fill:#5b6876} .ah-async{fill:#7a58b0}</style><rect x="0" y="0" width="1000" height="740" fill="#ffffff"/>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
    <marker id="mf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-flow"/></marker>
    <marker id="mm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah-muted"/></marker>
  </defs>
  <rect x="0" y="0" width="1000" height="740" fill="#ffffff"/>

  <rect x="40" y="30" width="200" height="60" rx="4" class="b-plain"/>
  <text x="56" y="55" class="t-h">Customer</text>
  <text x="56" y="75" class="t-s">sends a session cookie</text>

  <text x="346" y="122" class="t-zone" style="fill:#2f6fb3">Google edge · global</text>
  <rect x="260" y="130" width="440" height="80" rx="4" class="b-edge"/>
  <text x="278" y="158" class="t-h">HTTPS load balancer</text>
  <text x="278" y="178" class="t-s">one public IP · TLS certificate</text>
  <text x="278" y="196" class="t-s">spreads traffic over healthy pods</text>

  <rect x="20" y="240" width="960" height="380" rx="6" class="b-region"/>
  <text x="600" y="262" class="t-zone" style="fill:#5b6876">europe-west2 (London) · private network</text>

  <rect x="40" y="278" width="520" height="322" rx="5" class="b-gke"/>

  <g>
    <text x="60" y="344" class="t-zone" style="fill:#3b8a6e">zone a</text>
    <rect x="60" y="350" width="150" height="110" rx="4" class="b-pod"/>
    <text x="72" y="374" class="t-h">file-service</text>
    <text x="72" y="394" class="t-m">10 pods</text>
    <text x="72" y="414" class="t-m">check session</text>
    <text x="72" y="430" class="t-m">look up file</text>
    <text x="72" y="446" class="t-m">return or redirect</text>
  </g>
  <g>
    <text x="220" y="344" class="t-zone" style="fill:#3b8a6e">zone b</text>
    <rect x="220" y="350" width="150" height="110" rx="4" class="b-pod"/>
    <text x="232" y="374" class="t-h">file-service</text>
    <text x="232" y="394" class="t-m">10 pods</text>
  </g>
  <g>
    <text x="380" y="344" class="t-zone" style="fill:#3b8a6e">zone c</text>
    <rect x="380" y="350" width="150" height="110" rx="4" class="b-pod"/>
    <text x="392" y="374" class="t-h">file-service</text>
    <text x="392" y="394" class="t-m">10 pods</text>
  </g>
  <text x="60" y="492" class="t-h">GKE Autopilot cluster (regional)</text>
  <text x="60" y="512" class="t-m">Google manages the nodes · private nodes, no public IPs</text>
  <text x="60" y="538" class="t-s">Autoscaler: 30 to 100 pods on CPU · rolling updates with no downtime</text>
  <text x="60" y="560" class="t-s">One zone down still leaves two thirds of the pods</text>
  <text x="60" y="584" class="t-m">Workload Identity (no keys) · network policies · non-root containers</text>

  <rect x="600" y="290" width="360" height="120" rx="4" class="b-data"/>
  <text x="616" y="316" class="t-h">Cloud SQL (PostgreSQL, HA)</text>
  <text x="616" y="338" class="t-s">accounts, sessions, file details</text>
  <text x="616" y="358" class="t-s">answers "who is this? do they own this file?"</text>
  <text x="616" y="380" class="t-m">standby in 2nd zone · daily backups</text>
  <text x="616" y="398" class="t-m">replaces "Database Pod"</text>

  <rect x="600" y="450" width="360" height="120" rx="4" class="b-data"/>
  <text x="616" y="476" class="t-h">Cloud Storage bucket</text>
  <text x="616" y="498" class="t-s">the files themselves (the bytes)</text>
  <text x="616" y="518" class="t-s">private · versioned · spread over zones</text>
  <text x="616" y="540" class="t-m">replaces "Google Compute Disk"</text>

  <rect x="40" y="650" width="920" height="64" rx="4" class="b-plain"/>
  <text x="56" y="676" class="t-h">Cloud Monitoring and Logging</text>
  <text x="56" y="698" class="t-s">success-rate and latency SLOs with alerts · app metrics · structured logs · uptime check</text>

  <path d="M140,90 V108 H330 V130" class="a-flow" marker-end="url(#mf)"/>
  <path d="M270,210 V228 H135 V350" class="a-flow" marker-end="url(#mf)"/>
  <path d="M295,210 V350" class="a-flow" marker-end="url(#mf)"/>
  <path d="M455,210 V350" class="a-flow" marker-end="url(#mf)"/>
  <path d="M530,400 H570 V345 H600" class="a" marker-end="url(#m)"/>
  <path d="M530,440 H570 V505 H600" class="a" marker-end="url(#m)"/>
  <path d="M240,60 H985 V505 H960" class="a-flow" stroke-dasharray="7 5" marker-end="url(#mf)"/>
  <text x="540" y="52" class="t-m" style="fill:#c23d5b">large files: download directly with a 5-min signed link</text>

  <circle cx="140" cy="102" r="10" class="dot"/><text x="136.5" y="106" class="n">1</text>
  <circle cx="215" cy="228" r="10" class="dot"/><text x="211.5" y="232" class="n">2</text>
  <circle cx="585" cy="345" r="10" class="dot"/><text x="581.5" y="349" class="n">3</text>
  <circle cx="570" cy="372" r="10" class="dot"/><text x="566.5" y="376" class="n">4</text>
  <circle cx="570" cy="472" r="10" class="dot"/><text x="566.5" y="476" class="n">5</text>
  <circle cx="985" cy="280" r="10" class="dot"/><text x="981.5" y="284" class="n">6</text>
</svg>